name: Deploy AI Answer Worker

# 站点问答的生成端。召回在浏览器端由 Pagefind 完成，此 Worker 只负责生成，
# 因此部署的是无状态代码，变更即发布。
#
# 凭据优先使用 CLOUDFLARE_WORKERS_API_TOKEN：部署 Worker 所需的权限
# （Workers Scripts:Edit 等）与 AI Search 系列工作流不同，拆成独立令牌可以
# 避免为同一枚令牌叠加过多权限。未配置该变量时回退到 CLOUDFLARE_API_TOKEN。
# 两者都未配置时跳过而不失败，与既有约定一致。
#
# 说明：常规部署已改由 Cloudflare Workers Builds 的 Git 集成接管
# （见 cloudflare/README.md §5.2），该路径由 Cloudflare 侧持有 GitHub 授权，
# 不需要仓库保存部署令牌。本工作流降级为手动兜底，故不随推送自动触发——
# 当前仓库密钥缺 Workers Scripts:Edit 与 User:Memberships:Read 两项权限，
# 自动触发会以 Authentication error [code: 10000] 失败，只产生噪音。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-answer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy Worker
        working-directory: cloudflare/ai-answer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，跳过部署。"
            exit 0
          fi
          npx --yes wrangler@4 deploy
