name: AI Search Sync

# 索引作业的失败主要来自 Workers AI 错误码 3040（瞬时容量不足），与每日
# 10,000 Neurons 免费额度无关，因此把触发时点安排在额度重置之后并不能缓解该问题。
#
# 触发频率维持每日一次属于保守选择：更高频的多轮确实可能提高命中空闲窗口的概率，
# 但也会让同一批失败文件被反复重排。改为多轮的收益需先在错峰时段实测确认，
# 评估依据见 adr/2026-09-14-AI-Search-容量限流调优.md §5.4。
#
# 实例侧的 sync_interval 同样会周期性触发索引作业，与本工作流存在职责重叠，
# 两者宜择一承担频次控制，见同一文档 §5.4 第 1 项。
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trigger sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo '::warning::未配置 CLOUDFLARE_API_TOKEN，跳过同步。'
            exit 0
          fi
          chmod +x scripts/cloudflare-ai-search-sync.sh
          ./scripts/cloudflare-ai-search-sync.sh
