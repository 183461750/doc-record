name: Content Check

on:
  pull_request:
    paths:
      - 'src/content/docs/**'
      - 'scripts/check-content.py'
      - '.github/workflows/content-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      # 代码块语言检查需要读取 Shiki 的语言清单，因此依赖必须安装完整
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 收集变更的 Markdown 文件
        id: changes
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          # core.quotepath=false 保留中文文件名原样输出；-z 以 NUL 分隔，
          # 文件名中的空格、引号与中文不会被转义或拆断。
          # 文件列表经 heredoc 以多行形式写入 step output
          {
            echo 'files<<EOF'
            git -c core.quotepath=false diff --name-only -z --diff-filter=ACMR "$base" HEAD \
              -- 'src/content/docs/**/*.md' 'src/content/docs/**/*.mdx' | tr '\0' '\n'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # 文件名含空格与中文，必须以 NUL 分隔传参（xargs -0），避免按空白拆断；
      # git 路径本身不含换行，换行分隔 → NUL 的转换是安全的。
      # 文件列表经 env 传入而非 ${{ }} 内联：内容中可能含反引号等字符，
      # 内联会被 shell 解释（既有文件名 `--recurse-submodules` 曾触发）
      - name: 运行内容门禁（仅变更文件）
        if: steps.changes.outputs.files != ''
        env:
          FILES: ${{ steps.changes.outputs.files }}
        run: printf '%s\n' "$FILES" | tr '\n' '\0' | xargs -0 python3 scripts/check-content.py --require-languages

      - name: 无内容变更
        if: steps.changes.outputs.files == ''
        run: echo '本次变更未涉及 Markdown 内容，跳过检查。'
